# Build every platform and publish them as one GitHub Release.
#
# The release this produces is what the in-app update check reads (see
# Backend/updates.py), so the tag must be the version: v1.0.0 for package.json
# "1.0.0". The job refuses to run if those two disagree, because a mismatch
# would either nag every user forever or never notify them at all.
#
# To cut a release:
#   1. bump "version" in package.json and commit it
#   2. git tag v1.0.0 && git push origin v1.0.0
#
# Each target is built on its own runner because the vendored pip wheels contain
# compiled extensions (pydantic-core, lxml, numpy, pandas) that must match the
# platform they will run on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist, e.g. v1.0.0)"
        required: true

permissions:
  contents: write      # needed to create the release and upload assets

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        name: The tag and package.json must agree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG. Bump package.json, or retag."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14          # Apple Silicon
          - target: darwin-x64
            runner: macos-13          # Intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # This repo is pnpm-only: there is no package-lock.json, so `npm ci` and
      # `cache: npm` both fail outright. No version is given here on purpose:
      # the action reads packageManager from package.json, so CI always uses the
      # pnpm that wrote the lockfile. Pinning pnpm 9 here failed with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH against a lockfile written by pnpm 11.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (macOS / Linux)
        if: matrix.target != 'win-x64'
        run: bash packaging/build.sh ${{ matrix.target }}

      - name: Install Inno Setup (Windows)
        if: matrix.target == 'win-x64'
        run: choco install innosetup --no-progress -y

      - name: Build (Windows)
        if: matrix.target == 'win-x64'
        run: powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1

      # Only the finished artifacts, never the staging directories, which hold
      # an unpacked copy of everything and would be gigabytes per target.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist-bundle/*.dmg
            dist-bundle/*.zip
            dist-bundle/*Setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*Setup.exe' \) \
            -exec cp {} release/ \;
          cd release
          # One file people can verify a download against, rather than trusting
          # that an unsigned build arrived intact.
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Evidence Engine ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Install

            | Platform | Download | How |
            |---|---|---|
            | macOS (Apple Silicon) | `EvidenceEngine-${{ needs.check-version.outputs.version }}-darwin-arm64.dmg` | Open it and drag Evidence Engine to Applications |
            | macOS (Intel) | `EvidenceEngine-${{ needs.check-version.outputs.version }}-darwin-x64.dmg` | Open it and drag Evidence Engine to Applications |
            | Windows | `EvidenceEngine-${{ needs.check-version.outputs.version }}-win-x64-Setup.exe` | Run it, then open Evidence Engine from the Start Menu |
            | Linux | `EvidenceEngine-${{ needs.check-version.outputs.version }}-linux-x64.zip` | Unzip and run `launch.sh` |

            No account, no API keys. The default model runs on your own machine.

            **These builds are not code-signed**, so the first open needs one extra step:
            on macOS, control-click the app and choose Open (or System Settings,
            Privacy & Security, "Open Anyway"); on Windows, choose "More info" then
            "Run anyway".

            The first launch takes a few minutes while it builds its Python
            environment and downloads the local model (about 4 GB).

            ## Updating

            Install this version over the old one. Your reviews live in
            `~/.evidence-engine` (`%USERPROFILE%\.evidence-engine` on Windows),
            outside the app, so nothing is lost.

            Verify a download against `SHA256SUMS`.
